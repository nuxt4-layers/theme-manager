# Packages allowed to run install scripts when developing this layer (hosts decide
# for themselves; this file is not read when the layer is installed as a dependency).
allowBuilds:
  esbuild: true

# Refuse packages published less than a day ago (pnpm 12's default, stated here so
# every pnpm version that reads this file resolves the lockfile the same way).
minimumReleaseAge: 1440
